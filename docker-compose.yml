services:
  neo4j:
    image: neo4j:5-community
    container_name: activedecoy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ActiveDecoyNeo4j!}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - activedecoy

  app:
    build: .
    container_name: activedecoy-app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ActiveDecoyNeo4j!}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SESSION_SECRET: ${SESSION_SECRET:-active-decoy-docker-dev-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-HwatSauce}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Active-Decoy!2026}
      LDAP_HOST: ${LDAP_HOST:-dc01.lab.local}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      HYPERVISOR_TYPE: ${HYPERVISOR_TYPE:-vmware}
      HYPERVISOR_ENDPOINT: ${HYPERVISOR_ENDPOINT:-}
      HYPERVISOR_USERNAME: ${HYPERVISOR_USERNAME:-}
      HYPERVISOR_PASSWORD: ${HYPERVISOR_PASSWORD:-}
      HYPERVISOR_VM_NAME: ${HYPERVISOR_VM_NAME:-Washu-DC}
      HYPERVISOR_WRAPPER_COMMAND: ${HYPERVISOR_WRAPPER_COMMAND:-}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - activedecoy

volumes:
  neo4j_data:

networks:
  activedecoy:
    driver: bridge
