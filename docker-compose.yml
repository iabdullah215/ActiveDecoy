services:
  neo4j:
    image: neo4j:5-community
    container_name: activedecoy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ActiveDecoyNeo4j!}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - activedecoy

  app:
    build: .
    container_name: activedecoy-app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ActiveDecoyNeo4j!}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SESSION_SECRET: ${SESSION_SECRET:-active-decoy-docker-dev-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-HwatSauce}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Active-Decoy!2026}
      ENFORCE_SECURE_DEFAULTS: ${ENFORCE_SECURE_DEFAULTS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      LDAP_HOST: ${LDAP_HOST:-dc01.lab.local}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      HYPERVISOR_TYPE: ${HYPERVISOR_TYPE:-vmware}
      HYPERVISOR_ENDPOINT: ${HYPERVISOR_ENDPOINT:-}
      HYPERVISOR_USERNAME: ${HYPERVISOR_USERNAME:-}
      HYPERVISOR_PASSWORD: ${HYPERVISOR_PASSWORD:-}
      HYPERVISOR_VM_NAME: ${HYPERVISOR_VM_NAME:-Washu-DC}
      HYPERVISOR_WRAPPER_COMMAND: ${HYPERVISOR_WRAPPER_COMMAND:-}
      CONNECTION_RETRIES: ${CONNECTION_RETRIES:-3}
      CONNECTION_RETRY_DELAY: ${CONNECTION_RETRY_DELAY:-0.5}
      LDAP_PAGE_SIZE: ${LDAP_PAGE_SIZE:-200}
      LDAP_MAX_OBJECTS: ${LDAP_MAX_OBJECTS:-500}
      AD_PROVISION_ENABLED: ${AD_PROVISION_ENABLED:-false}
      AD_HONEY_OU: ${AD_HONEY_OU:-}
      AD_HONEY_NAME_PREFIX: ${AD_HONEY_NAME_PREFIX:-hw_}
      AD_REQUIRE_NAME_PREFIX: ${AD_REQUIRE_NAME_PREFIX:-true}
      AD_MONITORED_DOMAINS: ${AD_MONITORED_DOMAINS:-}
      AD_HARDEN_ON_PROVISION: ${AD_HARDEN_ON_PROVISION:-false}
      AD_HONEY_WORKSTATIONS_LOCK: ${AD_HONEY_WORKSTATIONS_LOCK:-NONEXISTENT-AD-LOCK}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800}
      TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-}
      CONSOLE_AUTH_MODE: ${CONSOLE_AUTH_MODE:-env}
      CONSOLE_LDAP_DOMAIN: ${CONSOLE_LDAP_DOMAIN:-}
      AGENT_INGEST_TOKEN: ${AGENT_INGEST_TOKEN:-}
      AGENT_STALE_SECONDS: ${AGENT_STALE_SECONDS:-90}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - activedecoy

volumes:
  neo4j_data:

networks:
  activedecoy:
    driver: bridge
