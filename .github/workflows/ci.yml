name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke check
        run: python -c "from app.main import app; print(app.title, app.version)"

      - name: Unit and API tests
        env:
          SESSION_SECRET: ci-test-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: changeme-dev-only
          NEO4J_PASSWORD: ""
        run: python -m unittest discover -s tests -v

      - name: Compose file syntax
        run: docker compose -f docker-compose.yml config >/dev/null
