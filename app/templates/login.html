<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · ActiveDecoy</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body class="login-body">
  <div class="login-panel">
    <div class="login-panel__brand">
      <img src="{{ url_for('static', path='img/logo.svg') }}" alt="" class="login-panel__logo" width="48" height="48" />
      <h1 class="login-panel__name">ActiveDecoy</h1>
      <p class="login-panel__tagline">Identity threat detection &amp; deception platform</p>
    </div>

    <div class="login-card">
      <h2 class="login-card__title">Sign in to console</h2>
      <p class="login-card__sub">Use your administrator credentials.</p>

      {% if error %}
      <div class="login-alert" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" class="login-form">
        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--primary">Sign in</button>
      </form>
    </div>

    <p class="login-foot">Authorized security research and lab use only.</p>
  </div>
</body>
</html>
