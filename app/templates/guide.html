{% extends "base.html" %}
{% block content %}
<section class="glass-panel rounded-3xl p-6">
  <div class="flex items-center justify-between gap-4">
    <div>
      <div class="text-xs uppercase tracking-[0.35em] text-cyan-300/70">User Guide</div>
      <h2 class="mt-3 text-3xl font-semibold">Markdown Documentation Viewer</h2>
    </div>
    <div class="text-sm text-slate-400">Rendered from project content</div>
  </div>
  <article id="markdown-viewer" class="prose prose-invert max-w-none prose-headings:text-cyan-200 prose-a:text-cyan-300 mt-6 rounded-2xl border border-slate-800 bg-slate-950/70 p-6"></article>
</section>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const markdown = {{ guide_markdown | tojson }};
  const viewer = document.getElementById('markdown-viewer');
  if (viewer && window.marked) {
    viewer.innerHTML = window.marked.parse(markdown);
  }
</script>
{% endblock %}
