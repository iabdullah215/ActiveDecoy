{% extends "base.html" %}
{% block content %}
{% set eyebrow = "Documentation" %}{% set heading = "User guide" %}{% set lead = "" %}
{% include "partials/page_header.html" %}

<div class="card">
  <div class="card__body">
    <article id="markdown-viewer" class="prose-doc"></article>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const markdown = {{ guide_markdown | tojson }};
  const viewer = document.getElementById("markdown-viewer");
  if (viewer && window.marked) viewer.innerHTML = window.marked.parse(markdown);
</script>
{% endblock %}
